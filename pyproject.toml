[project]
name = "multi-agent-mcp-travel-planner"
version = "0.1.0"
description = "Multi-Agent AI Travel Booking System built with LangGraph, Groq, and MCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aviationstack-mcp>=1.6.0",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.6",
    "langgraph-checkpoint-postgres>=3.1.0",
    "mcp>=1.28.0",
    "psycopg>=3.3.4",
    "psycopg-binary>=3.3.4",
    "psycopg-pool>=3.3.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
    "tavily-python>=0.7.26",
]
